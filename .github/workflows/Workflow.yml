name: Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specifications:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job runs a third-party npm package. Leaving the token in .git/config
          # would hand it to every transitive dependency.
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate specifications
        run: npx --yes @fission-ai/openspec@1.6.0 validate --all --strict --no-interactive

  windows:
    name: windows-2022
    needs: specifications
    runs-on: windows-2022
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: ValidateRelease and the changelog compare URL both
          # run `git describe --tags`, which answers with a commit hash on a shallow
          # clone and silently disables the duplicate-release guard.
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run Nuke build
        run: ./.nuke/build.cmd Compile Test PublishGitHub --GitHubToken ${{ secrets.GITHUB_TOKEN }}
